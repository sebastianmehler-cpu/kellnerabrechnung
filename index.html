<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kellerabrechnung</title>

<style>

:root{
--primary:#1F4E79;
--danger:#dc3545;
--bg:#f4f7fb;
}

body{
margin:0;
font-family:-apple-system,Arial,sans-serif;
background:var(--bg);
padding:15px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
text-align:center;
color:var(--primary);
}

.subtitle{
text-align:center;
color:#666;
margin-bottom:20px;
}

.dashboard{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:white;
border-radius:15px;
padding:15px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat{
text-align:center;
}

.stat-title{
font-size:18px;
color:#555;
}

.stat-value{
font-size:30px;
font-weight:bold;
margin-top:8px;
}

.section{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.section h2{
color:var(--primary);
margin-top:0;
}

.table-header,
.row{
display:grid;
grid-template-columns:2fr 100px 120px 120px 60px;
gap:10px;
align-items:center;
margin-bottom:8px;
}

.table-header{
font-weight:bold;
padding-bottom:8px;
border-bottom:1px solid #ddd;
}

input{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:8px;
}

.sum-box{
background:#f0f3f7;
padding:10px;
border-radius:8px;
text-align:right;
font-weight:bold;
}

.btn-add{
width:100%;
padding:12px;
background:var(--primary);
color:white;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.btn-delete{
background:var(--danger);
color:white;
border:none;
border-radius:10px;
cursor:pointer;
height:42px;
}

.result{
background:var(--primary);
color:white;
text-align:center;
padding:20px;
border-radius:15px;
}

.result-big{
font-size:36px;
font-weight:bold;
}

.footer{
display:flex;
gap:10px;
}

.footer button{
flex:1;
padding:12px;
background:var(--primary);
color:white;
border:none;
border-radius:10px;
font-weight:bold;
}

@media(max-width:750px){

.table-header{
display:none;
}

.row{
grid-template-columns:1fr;
padding-bottom:15px;
border-bottom:1px solid #eee;
}

}

</style>
</head>
<body>

<div class="container">

<h1>🍺 Kellerabrechnung</h1>
<div class="subtitle">
Vereinskasse & Tagesabrechnung
</div>

<div class="dashboard">

<div class="card stat">
<div class="stat-title">💰 Umsatz</div>
<div class="stat-value" id="umsatzCard">0,00 €</div>
</div>

<div class="card stat">
<div class="stat-title">🎫 Provision</div>
<div class="stat-value" id="provCard">0,00 €</div>
</div>

<div class="card stat">
<div class="stat-title">➖ Abzüge</div>
<div class="stat-value" id="abzugCard">0,00 €</div>
</div>

</div>

<div class="section">

<h2>🍺 Getränke</h2>

<div class="table-header">
<div>Getränk</div>
<div>Anzahl</div>
<div>Preis (€)</div>
<div>Summe (€)</div>
<div></div>
</div>

<div id="drinkList"></div>

<button class="btn-add" onclick="addDrink()">
+ Getränk hinzufügen
</button>

</div>

<div class="section">

<h2>🎫 Abzüge</h2>

<div class="table-header">
<div>Abzug</div>
<div>Anzahl</div>
<div>Wert (€)</div>
<div>Summe (€)</div>
<div></div>
</div>

<div id="deductionList"></div>

<button class="btn-add" onclick="addDeduction()">
+ Abzug hinzufügen
</button>

</div>

<div class="section">

<h2>⚙️ Provision (%)</h2>

<input
id="provision"
type="number"
value="10"
oninput="calculate()">

</div>

<div class="result">
<div>💵 Auszahlung</div>
<div class="result-big" id="auszahlung">
0,00 €
</div>
</div>

<br>

<div class="footer">
<button onclick="saveData()">💾 Speichern</button>
<button onclick="window.print()">📄 PDF</button>
</div>

</div>

<script>

let drinks = [
{name:'Bier',qty:0,price:0},
{name:'Weizen',qty:0,price:0},
{name:'Cola',qty:0,price:0}
];

let deductions = [
{name:'Gutscheine',qty:0,price:0}
];

function render(){

const drinkList=document.getElementById('drinkList');
drinkList.innerHTML='';

drinks.forEach((d,index)=>{

const row=document.createElement('div');
row.className='row';

row.innerHTML=`
<input value="${d.name}"
oninput="drinks[${index}].name=this.value">

<input type="number"
value="${d.qty}"
oninput="drinks[${index}].qty=Number(this.value);calculate()">

<input type="number"
step="0.01"
value="${d.price}"
oninput="drinks[${index}].price=Number(this.value);calculate()">

<div class="sum-box" id="drinkSum${index}">
0.00 €
</div>

<button class="btn-delete"
onclick="deleteDrink(${index})">
🗑
</button>
`;

drinkList.appendChild(row);

});

const deductionList=document.getElementById('deductionList');
deductionList.innerHTML='';

deductions.forEach((d,index)=>{

const row=document.createElement('div');
row.className='row';

row.innerHTML=`
<input value="${d.name}"
oninput="deductions[${index}].name=this.value">

<input type="number"
value="${d.qty}"
oninput="deductions[${index}].qty=Number(this.value);calculate()">

<input type="number"
step="0.01"
value="${d.price}"
oninput="deductions[${index}].price=Number(this.value);calculate()">

<div class="sum-box" id="deductionSum${index}">
0.00 €
</div>

<button class="btn-delete"
onclick="deleteDeduction(${index})">
🗑
</button>
`;

deductionList.appendChild(row);

});

calculate();
}

function addDrink(){

drinks.push({
name:'Neues Getränk',
qty:0,
price:0
});

render();
}

function addDeduction(){

deductions.push({
name:'Neuer Abzug',
qty:0,
price:0
});

render();
}

function deleteDrink(index){
drinks.splice(index,1);
render();
}

function deleteDeduction(index){
deductions.splice(index,1);
render();
}

function calculate(){

let revenue=0;
let deductionTotal=0;

drinks.forEach((d,index)=>{

const sum=d.qty*d.price;
revenue+=sum;

const field=document.getElementById('drinkSum'+index);

if(field){
field.innerHTML=sum.toFixed(2)+' €';
}

});

deductions.forEach((d,index)=>{

const sum=d.qty*d.price;
deductionTotal+=sum;

const field=document.getElementById('deductionSum'+index);

if(field){
field.innerHTML=sum.toFixed(2)+' €';
}

});

const provisionRate=
Number(document.getElementById('provision').value)||0;

const provision=
revenue*provisionRate/100;

const payout=
revenue-provision-deductionTotal;

document.getElementById('umsatzCard').innerHTML=
revenue.toFixed(2)+' €';

document.getElementById('provCard').innerHTML=
provision.toFixed(2)+' €';

document.getElementById('abzugCard').innerHTML=
deductionTotal.toFixed(2)+' €';

document.getElementById('auszahlung').innerHTML=
payout.toFixed(2)+' €';

}

function saveData(){

localStorage.setItem(
'drinks',
JSON.stringify(drinks)
);

localStorage.setItem(
'deductions',
JSON.stringify(deductions)
);

alert('✅ Abrechnung gespeichert');
}

render();

</script>

</body>
</html>
