<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kellerabrechnung</title>

<style>

:root{
    --primary:#1F4E79;
    --success:#28a745;
    --danger:#dc3545;
    --bg:#f4f7fb;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,Arial,sans-serif;
    background:var(--bg);
}

.container{
    max-width:1200px;
    margin:auto;
    padding:15px;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    color:var(--primary);
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
    margin-bottom:20px;
}

.stat{
    background:white;
    border-radius:16px;
    padding:20px;
    text-align:center;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.statTitle{
    color:#666;
    margin-bottom:10px;
}

.statValue{
    font-size:28px;
    font-weight:bold;
}

.card{
    background:white;
    border-radius:16px;
    padding:15px;
    margin-bottom:20px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

h2{
    color:var(--primary);
}

.tableHeader,
.row{
    display:grid;
    grid-template-columns:2fr 100px 120px 120px 60px;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
}

.tableHeader{
    font-weight:bold;
    border-bottom:1px solid #ddd;
    padding-bottom:8px;
}

input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    border:none;
    border-radius:10px;
    padding:12px;
    cursor:pointer;
}

.btnAdd{
    width:100%;
    background:var(--primary);
    color:white;
    font-weight:bold;
}

.btnDelete{
    background:var(--danger);
    color:white;
}

.footer{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.footer button{
    flex:1;
    color:white;
    background:var(--primary);
}

.result{
    background:var(--primary);
    color:white;
    text-align:center;
    padding:20px;
    border-radius:16px;
}

.resultValue{
    font-size:36px;
    font-weight:bold;
}

@media(max-width:700px){

.tableHeader{
    display:none;
}

.row{
    grid-template-columns:1fr;
    padding-bottom:15px;
    border-bottom:1px solid #eee;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🍺 Kellerabrechnung</h1>
<p>Vereinskasse & Tagesabrechnung</p>
</div>

<div class="dashboard">

<div class="stat">
<div class="statTitle">💰 Umsatz</div>
<div id="umsatzCard" class="statValue">0,00 €</div>
</div>

<div class="stat">
<div class="statTitle">🎫 Provision</div>
<div id="provisionCard" class="statValue">0,00 €</div>
</div>

<div class="stat">
<div class="statTitle">➖ Abzüge</div>
<div id="abzugCard" class="statValue">0,00 €</div>
</div>

</div>

<div class="card">

<h2>🍺 Getränke</h2>

<div class="tableHeader">
<div>Getränk</div>
<div>Anzahl</div>
<div>Preis (€)</div>
<div>Summe (€)</div>
<div></div>
</div>

<div id="drinkList"></div>

<button class="btnAdd" onclick="addDrink()">
+ Getränk hinzufügen
</button>

</div>

<div class="card">

<h2>🎫 Abzüge</h2>

<div class="tableHeader">
<div>Abzug</div>
<div>Anzahl</div>
<div>Preis (€)</div>
<div>Summe (€)</div>
<div></div>
</div>

<div id="deductionList"></div>

<button class="btnAdd" onclick="addDeduction()">
+ Abzug hinzufügen
</button>

</div>

<div class="card">

<h2>⚙️ Provision (%)</h2>

<input
id="provision"
type="number"
value="10"
oninput="calculate()">

</div>

<div class="result">
<div>💵 Auszahlung</div>
<div id="auszahlung" class="resultValue">
0,00 €
</div>
</div>

<div class="footer">
<button onclick="saveData()">💾 Speichern</button>
<button onclick="window.print()">📄 PDF</button>
</div>

</div>

<script>

let drinks = [
    {name:"Bier",qty:0,price:0},
    {name:"Weizen",qty:0,price:0},
    {name:"Cola",qty:0,price:0}
];

let deductions = [
    {name:"Gutscheine",qty:0,price:0}
];

function addDrink(){

    drinks.push({
        name:"Neues Getränk",
        qty:0,
        price:0
    });

    render();
}

function addDeduction(){

    deductions.push({
        name:"Neuer Abzug",
        qty:0,
        price:0
    });

    render();
}

function saveData(){

    localStorage.setItem(
        "drinks",
        JSON.stringify(drinks)
    );

    localStorage.setItem(
        "deductions",
        JSON.stringify(deductions)
    );

    alert("Abrechnung gespeichert");
}

function render(){

    let drinkHtml="";

    drinks.forEach((d,i)=>{

        drinkHtml+=`
        <div class="row">

        <input
        value="${d.name}"
        onchange="drinks[${i}].name=this.value">

        <input
        type="number"
        value="${d.qty}"
        onchange="drinks[${i}].qty=parseFloat(this.value)||0;calculate()">

        <input
        type="number"
        step="0.01"
        value="${d.price}"
        onchange="drinks[${i}].price=parseFloat(this.value)||0;calculate()">

        <div>
        <strong>${(d.qty*d.price).toFixed(2)} €</strong>
        </div>

        <button
        class="btnDelete"
        onclick="drinks.splice(${i},1);render()">
        🗑
        </button>

        </div>
        `;
    });

    document.getElementById("drinkList").innerHTML=drinkHtml;

    let deductionHtml="";

    deductions.forEach((d,i)=>{

        deductionHtml+=`
        <div class="row">

        <input
        value="${d.name}"
        onchange="deductions[${i}].name=this.value">

        <input
        type="number"
        value="${d.qty}"
        onchange="deductions[${i}].qty=parseFloat(this.value)||0;calculate()">

        <input
        type="number"
        step="0.01"
        value="${d.price}"
        onchange="deductions[${i}].price=parseFloat(this.value)||0;calculate()">

        <div>
        <strong>${(d.qty*d.price).toFixed(2)} €</strong>
        </div>

        <button
        class="btnDelete"
        onclick="deductions.splice(${i},1);render()">
        🗑
        </button>

        </div>
        `;
    });

    document.getElementById("deductionList").innerHTML=deductionHtml;

    calculate();
}

function calculate(){

    let revenue=0;
    let deductionTotal=0;

    drinks.forEach(d=>{
        revenue += d.qty * d.price;
    });

    deductions.forEach(d=>{
        deductionTotal += d.qty * d.price;
    });

    const provisionRate =
        Number(document.getElementById("provision").value) || 0;

    const provision =
        revenue * provisionRate / 100;

    const payout =
        revenue - provision - deductionTotal;

    document.getElementById("umsatzCard").innerText =
        revenue.toFixed(2) + " €";

    document.getElementById("provisionCard").innerText =
        provision.toFixed(2) + " €";

    document.getElementById("abzugCard").innerText =
        deductionTotal.toFixed(2) + " €";

    document.getElementById("auszahlung").innerText =
        payout.toFixed(2) + " €";
}

render();

</script>

</body>
</html>
