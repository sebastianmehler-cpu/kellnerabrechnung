<!DOCTYPE html>
<html lang="de">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>kellnerabrechnung</title>

<link rel="manifest" href="manifest

:root{
    --primary:#1F4E79;
    --danger:#dc3545;
    --bg:#f4f7fb;
}

body{
    margin:0;
    padding:10px;
    background:var(--bg);
    font-family:-apple-system,Arial,sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
    color:var(--primary);
    margin-bottom:5px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:20px;
}

.dashboard{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:15px;
}

.stat{
    background:white;
    border-radius:15px;
    padding:15px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.stat-title{
    font-size:14px;
    color:#666;
}

.stat-value{
    font-size:22px;
    font-weight:bold;
    margin-top:8px;
}

.section{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.section h2{
    color:var(--primary);
    margin-top:0;
}

.table-header,
.row{
    display:grid;
    grid-template-columns:120px 60px 75px 75px 40px;
    gap:5px;
    align-items:center;
}

.table-header{
    font-weight:bold;
    border-bottom:1px solid #ddd;
    margin-bottom:10px;
    padding-bottom:5px;
    font-size:14px;
}

.row{
    margin-bottom:8px;
}

input{
    width:100%;
    padding:8px;
    border:1px solid #ccc;
    border-radius:8px;
}

.sum-box{
    text-align:right;
    background:#eef2f5;
    border-radius:8px;
    padding:8px;
    font-weight:bold;
}

.btn-add{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:var(--primary);
    color:white;
    margin-top:10px;
    font-weight:bold;
}

.btn-delete{
    background:var(--danger);
    color:white;
    border:none;
    border-radius:10px;
    height:40px;
}

.result{
    background:var(--primary);
    color:white;
    text-align:center;
    border-radius:15px;
    padding:20px;
}

.result-value{
    font-size:36px;
    font-weight:bold;
}

.footer{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:15px;
}

.footer button{
    padding:10px;
    border:none;
    border-radius:10px;
    background:var(--primary);
    color:white;
    font-size:12px;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="container">

<h1>🍺 Abrechner 3000</h1>
<div class="subtitle">HERZOKELLNER</div>

<div class="dashboard">

<div class="stat">
<div class="stat-title">💰 Umsatz</div>
<div class="stat-value" id="umsatzCard">0,00 €</div>
</div>

<div class="stat">
<div class="stat-title">🎫 Provision</div>
<div class="stat-value" id="provCard">0,00 €</div>
</div>

<div class="stat">
<div class="stat-title">➖ Abzüge</div>
<div class="stat-value" id="abzugCard">0,00 €</div>
</div>

</div>

<div class="section">

<h2>🍺 Getränke</h2>

<div class="table-header">
<div>Getränk</div>
<div>Anzahl</div>
<div>Preis €</div>
<div>Summe €</div>
<div></div>
</div>

<div id="drinkList"></div>

<button class="btn-add" onclick="addDrink()">
+ Getränk hinzufügen
</button>

</div>

<div class="section">

<h2>🎫 Abzüge</h2>

<div class="table-header">
<div>Abzug</div>
<div>Anzahl</div>
<div>Wert €</div>
<div>Summe €</div>
<div></div>
</div>

<div id="deductionList"></div>

<button class="btn-add" onclick="addDeduction()">
+ Abzug hinzufügen
</button>

</div>

<div class="section">

<h2>⚙️ Provision (%)</h2>

<input
id="provision"
type="number"
inputmode="numeric"
min="0"
max="100"
step="1"
value="10"
oninput="calculate()">

</div>

<div class="result">

<div>💵 Auszahlung</div>

<div id="auszahlung" class="result-value">
0,00 €
</div>

</div>

<div id="saveStatus"
style="
text-align:center;
margin:10px;
font-weight:bold;
color:#1F4E79;">
</div>
    
<div class="footer">

<button onclick="saveConfig()">
⚙️ Konfig
</button>

<button onclick="saveData()">
💾 Speichern
</button>

<button onclick="newSettlement()">
🆕 Neu
</button>

<button onclick="window.print()">
📄 PDF
</button>

</div>

</div>

<script>

let drinks =
JSON.parse(localStorage.getItem("config_drinks")) || [
{name:"Bier",qty:0,price:0.00},
{name:"Weizen",qty:0,price:0.00},
{name:"Limo",qty:0,price:0.00}
];

let deductions =
JSON.parse(localStorage.getItem("config_deductions")) || [
{name:"Biermarken",qty:0,price:0.00}
];

function render(){

let html="";

drinks.forEach((d,index)=>{

html+=`
<div class="row">

<input value="${d.name}"
oninput="drinks[${index}].name=this.value">

<input
type="number"
inputmode="numeric"
min="0"
step="1"
value="${d.qty}"
oninput="drinks[${index}].qty=Number(this.value);calculate()">

<input
type="number"
inputmode="decimal"
min="0"
step="0.10"
value="${d.price}"
oninput="drinks[${index}].price=Number(this.value);calculate()">

<div class="sum-box" id="drinkSum${index}">
0.00 €
</div>

<button class="btn-delete"
onclick="deleteDrink(${index})">
🗑
</button>

</div>
`;

});

document.getElementById("drinkList").innerHTML=html;

html="";

deductions.forEach((d,index)=>{

html+=`
<div class="row">

<input value="${d.name}"
oninput="deductions[${index}].name=this.value">

<input
type="number"
inputmode="numeric"
min="0"
step="1"
value="${d.qty}"
oninput="deductions[${index}].qty=Number(this.value);calculate()">

<input
type="number"
inputmode="decimal"
min="0"
step="0.01"
value="${d.price}"
oninput="deductions[${index}].price=Number(this.value);calculate()">

<div class="sum-box" id="deductionSum${index}">
0.00 €
</div>

<button class="btn-delete"
onclick="deleteDeduction(${index})">
🗑
</button>

</div>
`;

});

document.getElementById("deductionList").innerHTML=html;

calculate();
}

function calculate(){

let revenue=0;
let deductionTotal=0;

drinks.forEach((d,index)=>{

let sum=d.qty*d.price;
revenue+=sum;

document.getElementById(
"drinkSum"+index
).innerHTML=sum.toFixed(2)+" €";

});

deductions.forEach((d,index)=>{

let sum=d.qty*d.price;
deductionTotal+=sum;

document.getElementById(
"deductionSum"+index
).innerHTML=sum.toFixed(2)+" €";

});

let provisionRate =
Number(
document.getElementById("provision").value
)||0;

let provision =
revenue * provisionRate / 100;

let payout =
revenue - provision - deductionTotal;

document.getElementById("umsatzCard").innerHTML =
revenue.toFixed(2)+" €";

document.getElementById("provCard").innerHTML =
provision.toFixed(2)+" €";

document.getElementById("abzugCard").innerHTML =
deductionTotal.toFixed(2)+" €";

document.getElementById("auszahlung").innerHTML =
payout.toFixed(2)+" €";
}

function addDrink(){

drinks.push({
name:"Neues Getränk",
qty:0,
price:0
});

render();
}

function addDeduction(){

deductions.push({
name:"Neuer Abzug",
qty:0,
price:0
});

render();
}

function deleteDrink(index){

drinks.splice(index,1);

render();
}

function deleteDeduction(index){

deductions.splice(index,1);

render();
}

function saveConfig(){

localStorage.setItem(
"config_drinks",
JSON.stringify(drinks)
);

localStorage.setItem(
"config_deductions",
JSON.stringify(deductions)
);

document.getElementById(
"saveStatus"
).innerHTML =
"✅ Konfiguration gespeichert";
}

function saveData(){

alert("✅ Abrechnung gespeichert");
}

function newSettlement(){

drinks.forEach(d=>d.qty=0);
deductions.forEach(d=>d.qty=0);

render();

document.getElementById(
"saveStatus"
).innerHTML =
"✅ Neue Abrechnung erstellt";
}

render();

</script>

    <script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js");
}
</script>

</body>
</html>
